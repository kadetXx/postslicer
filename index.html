<html lang="en">
<head>

<title>Slicey</title>

<body>

          <span>Coffee</span>
        </a>
        <a class="menu-link" href="mailto:techkadet@gmail.com?subject=Advertise%20on%20Slicey" target="_blank" rel="noopener noreferrer">

      <svg class="menu-divider" width="12" height="96" viewBox="0 0 12 96" preserveAspectRatio="none" aria-hidden="true">
        <path d="M 6 0 L 6.4 11.9 L 6.8 24.9 L 2.5 39.9 L 8.7 50.0 L 3.9 62.0 L 5.8 80.0 L 5.8 96" fill="none" stroke="var(--red)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.1 6.5" opacity="0.7" />
      </svg>
    </nav>

    <main class="stage">
      <div class="panel-label-row">
        <span class="panel-label"><span class="idx">02</span>Post slicing <span id="labelCount">&times;3</span></span>
        <div class="slice-toggle" role="tablist" aria-label="Number of slices">
          <button type="button" class="slice-tab" data-count="2" role="tab" aria-selected="false">2</button>
          <button type="button" class="slice-tab is-active" data-count="3" role="tab" aria-selected="true">3</button>
        </div>
      </div>

      <article class="receipt">
        <div class="receipt-head">
          <div class="receipt-title">*** SLICEY DELI ***</div>
          <div class="receipt-sub">timeline preview receipt</div>
        </div>

        <div class="tweet-identity">
          <div class="tweet-avatar" aria-hidden="true"></div>
          <div class="tweet-who">
            <span class="tweet-name">Your Name</span>
            <span class="tweet-handle">@yourhandle</span>
          </div>
        </div>

        <p class="tweet-text">this is what it'll look like once it posts ↓</p>

        <div class="carousel" id="carousel"></div>

        <div class="line-items">
          <div class="line-item"><span>1x full-res slices</span><span>FREE</span></div>
          <div class="line-item"><span>1x swipe-to-reveal effect</span><span>FREE</span></div>
          <div class="line-item total"><span>TOTAL</span><span>$0.00</span></div>
        </div>
      </article>

      <div class="stamp-row">
        <button type="button" class="stamp-btn photo-stamp" id="photoBtn" aria-label="Choose a photo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" stroke="white" stroke-width="2"/><circle cx="8.5" cy="9.5" r="1.5" stroke="white" stroke-width="2"/><path d="M3 16l5-4 4 3 4-5 5 6" stroke="white" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
        <input type="file" id="fileInput" accept="image/*" hidden />
        <button type="button" class="stamp-btn download-stamp" id="downloadBtn" aria-label="Slice and download">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4v12M12 16l5-5M12 16l-5-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </main>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="script.js"></script>
</body>
</html>
