<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Slicey</title>
<meta name="description" content="Cut a photo into equal strips for the Twitter/X slideshow carousel trick." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="frame">
    <span class="frame-corner tl"></span><span class="frame-corner tr"></span>
    <span class="frame-corner bl"></span><span class="frame-corner br"></span>

    <header class="frame-top">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <circle cx="6" cy="6" r="3" stroke="currentColor" stroke-width="2"/>
            <circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="2"/>
            <path d="M8.5 8L20 19M20 5L8.5 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="brand-name">SLICEY</span>
      </div>

      <div class="status">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText" hidden></span>
        <button type="button" class="btn-reset" id="resetBtn" hidden>RESET</button>
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch to dark mode">
          <svg class="icon-sun" width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <svg class="icon-moon" width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="frame-main">
      <section class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Upload a photo">
        <input type="file" id="fileInput" accept="image/*" hidden />
        <svg class="dropzone-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 16V4M12 4L7 9M12 4L17 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <p class="dropzone-label">Drop a photo, or click to choose</p>
      </section>

      <section class="workspace" id="workspace">
        <div class="panel panel-source">
          <div class="panel-label"><span class="idx">01</span>SOURCE</div>

          <div class="panel-body">
            <div class="preview" id="previewWrap">
              <img id="previewImg" alt="Uploaded photo preview" hidden />
              <div class="cuts" id="cutsOverlay" aria-hidden="true"></div>
              <div class="placeholder" id="previewPlaceholder">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="0" stroke="currentColor" stroke-width="1.5"/><circle cx="9" cy="10" r="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M3 16l5-4 4 3 4-5 5 6" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
                <span>No photo yet</span>
              </div>
            </div>

            <div class="segmented" role="tablist" aria-label="Number of slices">
              <button type="button" class="seg-btn is-active" data-count="3" role="tab" aria-selected="true">3 SLICES</button>
              <button type="button" class="seg-btn" data-count="2" role="tab" aria-selected="false">2 SLICES</button>
            </div>
          </div>
        </div>

        <div class="panel panel-output">
          <div class="panel-label"><span class="idx">02</span>TIMELINE PREVIEW</div>

          <div class="panel-body">
            <article class="tweet-card" id="tweetCard" data-mode="dark">
              <div class="tweet-head">
                <div class="tweet-avatar" aria-hidden="true"></div>
                <div class="tweet-who">
                  <span class="tweet-name">Your name</span>
                  <span class="tweet-handle">@yourhandle</span>
                </div>
                <div class="tweet-mode-swatches" role="radiogroup" aria-label="X display mode">
                  <button type="button" class="tweet-mode-swatch" data-mode="light" role="radio" aria-checked="false" aria-label="Default (light)"></button>
                  <button type="button" class="tweet-mode-swatch" data-mode="dim" role="radio" aria-checked="false" aria-label="Dim"></button>
                  <button type="button" class="tweet-mode-swatch is-active" data-mode="dark" role="radio" aria-checked="true" aria-label="Lights out"></button>
                </div>
              </div>

              <p class="tweet-text">this is what it'll look like once it posts ↓</p>

              <div class="tweet-media" id="tweetMedia">
                <div class="tweet-media-track" id="tweetTrack" hidden></div>
                <div class="placeholder-track" id="placeholderTrack"></div>
              </div>

              <div class="tweet-actions">
                <span class="tweet-action">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3 1-4.5A8 8 0 1 1 21 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                  14
                </span>
                <span class="tweet-action">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M17 2l4 4-4 4M7 22l-4-4 4-4M3 6h13a4 4 0 0 1 4 4v2M21 18H8a4 4 0 0 1-4-4v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  6
                </span>
                <span class="tweet-action">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7.5-4.6-10-9.3C.4 8 2 4.5 5.4 4a5 5 0 0 1 6.6 2 5 5 0 0 1 6.6-2c3.4.5 5 4 3.4 7.7C19.5 16.4 12 21 12 21Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                  128
                </span>
                <span class="tweet-action">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
              </div>
            </article>

            <button type="button" class="btn-download" id="downloadBtn" disabled>SLICE &amp; DOWNLOAD</button>
          </div>
        </div>
      </section>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="script.js"></script>
</body>
</html>
